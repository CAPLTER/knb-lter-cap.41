  - attribute:
      attributeName: flags
      levels:
      - code: empty_sampling_event
        definition: 'Indicates that there were not any organisms recorded for the entire sampling event (site and date). It cannot be known from the documentation whether organisms were not recorded because the traps were not set and-or collected or if the sampling was executed but none of the traps contained organisms. This is a cousin of the site_not_sampled flag applied to sampling events where a combination of organisms not recorded and technician comments suggest clearly that the sampling did not occur whereas the empty_sampling_event flag also denotes an empty sampling event but lacks the corresponding technician comments that provide additional evidence that the work was not conducted.'
      - code: empty_trap
        definition: 'indicates that a trap was set and collected but that the trap did not contain any organisms'
      - code: miscoded
        definition: 'indicates that the technician comments suggests that the sample was not collected and or did not contain organisms but for which organisms are recorded'
      - code: trap_not_collected
        definition: 'indicates that the particular trap was not set or collected or otherwise not surveyed'
  - attribute:
      attributeName: immature
      levels:
      - code: 'FALSE'
        definition: 'organism is an adult or othewise not an immature'
      - code: 'TRUE'
        definition: 'organism is an immature'
  - attribute:
      attributeName: winged
      levels:
      - code: 'FALSE'
        definition: 'organism does not have wings'
      - code: 'TRUE'
        definition: 'organism does have wings'
  - attribute:
      attributeName: size
      levels:
      - code: between 2 and 5 mm
        definition: 'the size of the organism is between 2 and 5 millimeters'
      - code: between 5 and 10 mm
        definition: 'the size of the organism is between 5 and 10 millimeters'
      - code: greater than 10 mm
        definition: 'the size of the organism is greater than 10 millimeters'
      - code: less than 2 mm
        definition: 'the size of the organism is less than 2 millimeters'
      - code: not measured
        definition: 'the size of the organism was not measured'
